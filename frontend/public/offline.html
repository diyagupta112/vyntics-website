<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline | Vyntics</title>
<style>
:root{--ink:#0b0b0f;--primary:#1453db;--accent:#2563eb;--page:#f6f7f8;--muted:rgb(11 11 15 / 62%);--border:rgb(11 11 15 / 10%)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem 1rem;background:var(--page);color:var(--ink);font-family:"DM Sans Variable","DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{width:100%;max-width:34rem;text-align:center}
.brand{display:inline-flex;align-items:center;gap:.75rem;margin-bottom:clamp(2rem,6svh,3.5rem)}
.mark{width:3.25rem;aspect-ratio:1442/1091;background:var(--ink);-webkit-mask:url("/images/vyntics-mark-transparent.png") center/contain no-repeat;mask:url("/images/vyntics-mark-transparent.png") center/contain no-repeat}
.word{font-size:.95rem;font-weight:760;letter-spacing:.16em}
.eyebrow{margin:0 0 .75rem;color:var(--primary);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem);line-height:1.15;font-weight:700;letter-spacing:-.01em}
p.text{margin:1rem auto 0;max-width:28rem;color:var(--muted);font-size:1rem}
.actions{margin-top:2rem}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:62.4375rem;padding:.8rem 1.75rem;transition:background-color 200ms ease,border-color 200ms ease}
button:hover{background:var(--accent);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--primary);outline-offset:.25rem}
.status{min-height:1.5rem;margin:1.25rem 0 0;color:var(--muted);font-size:.9rem}
.status[data-online="true"]{color:var(--primary)}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark" aria-hidden="true"></span><span class="word">VYNTICS</span></div>
  <p class="eyebrow">You&rsquo;re offline</p>
  <h1>Looks like you&rsquo;re offline.</h1>
  <p class="text">Check your internet connection and try again. We&rsquo;ll be here when you&rsquo;re back online.</p>
  <div class="actions"><button type="button" id="retry">Try Again</button></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<script>
(function () {
  var status = document.getElementById("status");
  document.getElementById("retry").addEventListener("click", function () {
    status.removeAttribute("data-online");
    status.textContent = "Checking your connection...";
    // The service worker serves this page again if the network is still down.
    location.reload();
  });
  window.addEventListener("online", function () {
    status.setAttribute("data-online", "true");
    status.textContent = "Your connection is back. Select Try Again to continue.";
  });
  window.addEventListener("offline", function () {
    status.removeAttribute("data-online");
    status.textContent = "";
  });
})();
</script>
</body>
</html>
